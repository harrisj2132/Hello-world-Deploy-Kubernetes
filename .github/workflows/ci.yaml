name : Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build and push:
    runs-on: ubuntu-latest

    steps:
      name: Checkout code
      uses: actions/checkout@v4
      #git clone httpsL://github.com/username/repo.git
      #cd your-repo

      name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

      name: Generate Docker image tag
      run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
      # VERSION=2026-11-09-172630)
      # Image name: yourimage:2026-11-09-172630

      name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-hello:${{ env.IMAGE_TAG }} .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-hello:${{ env.IMAGE_TAG }}
      